version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: srmfm_db
    environment:
      POSTGRES_DB: ${DB_NAME:-srmfm_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-srmfm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: srmfm_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-srmfm_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-12345}
    ports:
      - "8082:8082"
    env_file:
      - .env

volumes:
  postgres_data: