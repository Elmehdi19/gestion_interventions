<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-sm max-w-lg mx-auto">
  <h3 class="text-title-lg font-bold mb-6">Déposer une réclamation</h3>

  <form [formGroup]="form" (ngSubmit)="soumettre()" class="space-y-5">
    <!-- Spécialité -->
    <div>
      <label class="block text-label-md font-medium mb-1">Spécialité *</label>
      <select formControlName="specialiteConcerne"
              class="w-full border border-outline-variant rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary">
        <option [ngValue]="null">-- Choisissez --</option>
        <option *ngFor="let spec of specialites" [ngValue]="spec">{{ spec.libelle }}</option>
      </select>
      <div *ngIf="form.get('specialiteConcerne')?.invalid && form.get('specialiteConcerne')?.touched" 
           class="text-error text-label-md mt-1">
        La spécialité est obligatoire.
      </div>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-label-md font-medium mb-1">Description du problème *</label>
      <textarea formControlName="description" rows="4"
                class="w-full border border-outline-variant rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"
                placeholder="Décrivez précisément votre problème..."></textarea>
      <div *ngIf="form.get('description')?.invalid && form.get('description')?.touched" 
           class="text-error text-label-md mt-1">
        La description est obligatoire.
      </div>
    </div>

    <!-- Urgence (toggle visuel) -->
    <div class="flex items-center gap-3 p-3 bg-surface-container rounded-lg">
      <span class="material-symbols-outlined text-primary">priority_high</span>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" formControlName="urgente" class="w-4 h-4 rounded border-primary focus:ring-primary" />
        <span class="text-body-md">Réclamation urgente</span>
      </label>
    </div>

    <!-- Bouton avec état de chargement -->
    <div class="flex justify-end pt-2">
      <button type="submit" 
              [disabled]="form.invalid || isLoading"
              class="px-5 py-2 bg-primary text-on-primary rounded-lg font-bold shadow hover:bg-primary-variant transition disabled:opacity-50 flex items-center gap-2">
        <span *ngIf="isLoading" class="spinner-border animate-spin inline-block w-4 h-4 border-2 rounded-full border-white border-t-transparent"></span>
        {{ isLoading ? 'Envoi en cours...' : 'Envoyer la réclamation' }}
      </button>
    </div>
  </form>
</div>
