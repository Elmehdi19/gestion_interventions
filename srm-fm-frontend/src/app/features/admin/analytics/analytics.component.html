<div class="space-y-gutter">

  <!-- KPI Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-gutter">
    <div *ngFor="let kpi of kpis" class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm flex items-center gap-4">
      <div class="w-12 h-12 rounded-full flex items-center justify-center" [ngClass]="kpi.color">
        <span class="material-symbols-outlined text-xl">{{ kpi.icon }}</span>
      </div>
      <div>
        <p class="text-label-md text-on-surface-variant">{{ kpi.label }}</p>
        <p class="text-headline-md font-bold text-on-surface">{{ kpi.value }}</p>
      </div>
    </div>
  </div>

  <!-- Graphiques -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-gutter">
    <!-- Doughnut -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm">
      <h3 class="text-title-lg font-bold mb-6">Répartition par spécialité</h3>
      <div style="width: 250px; height: 250px; margin: 0 auto;">
        <canvas baseChart
                [data]="specialiteChartData"
                [options]="specialiteChartOptions"
                type="doughnut">
        </canvas>
      </div>
    </div>

    <!-- Bar chart -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm">
      <h3 class="text-title-lg font-bold mb-6">Évolution mensuelle</h3>
      <canvas baseChart
              [data]="evolutionChartData"
              [options]="evolutionChartOptions"
              type="bar">
      </canvas>
    </div>

    <!-- Horizontal bar -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm lg:col-span-2">
      <h3 class="text-title-lg font-bold mb-6">Performance par équipe</h3>
      <canvas baseChart
              [data]="equipeChartData"
              [options]="equipeChartOptions"
              type="bar">
      </canvas>
    </div>
  </div>
</div>
