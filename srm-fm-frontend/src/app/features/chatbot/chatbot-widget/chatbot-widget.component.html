<!-- Bouton flottant (FAB) -->
<button *ngIf="!isOpen"
        (click)="toggleChat()"
        class="fixed bottom-6 right-6 w-16 h-16 bg-primary text-on-primary rounded-full shadow-2xl flex items-center justify-center hover:scale-105 active:scale-95 transition-all z-50">
  <span class="material-symbols-outlined text-3xl">smart_toy</span>
  <div class="absolute -top-1 -right-1 w-4 h-4 bg-error rounded-full border-2 border-white animate-pulse"></div>
</button>

<!-- Fenêtre du chatbot -->
<div *ngIf="isOpen" class="fixed bottom-6 right-6 w-80 sm:w-96 bg-surface-container-lowest rounded-xl shadow-2xl border border-outline-variant z-50 flex flex-col"
     style="max-height: 500px;">
  <!-- Header -->
  <div class="bg-primary p-4 flex justify-between items-center text-on-primary rounded-t-xl">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-on-primary/20 flex items-center justify-center">
        <span class="material-symbols-outlined text-[20px]">smart_toy</span>
      </div>
      <div>
        <p class="font-bold text-body-md">SRM Assistant</p>
        <p class="text-[10px] opacity-80 uppercase tracking-tighter">AI Support Online</p>
      </div>
    </div>
    <button (click)="toggleChat()" class="p-1 hover:bg-white/10 rounded">
      <span class="material-symbols-outlined text-[18px]">close</span>
    </button>
  </div>

  <!-- Corps des messages -->
  <div class="flex-1 p-4 overflow-y-auto space-y-4 bg-surface-container-low" style="min-height: 250px;">
    <ng-container *ngFor="let msg of messages">
      <div *ngIf="msg.from === 'bot'" class="flex items-start gap-2">
        <div class="w-6 h-6 rounded-full bg-primary-container flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-[14px] text-primary">smart_toy</span>
        </div>
        <div class="bg-surface-container-highest p-3 rounded-lg rounded-tl-none text-body-md shadow-sm max-w-[80%]">
          {{ msg.text }}
        </div>
      </div>
      <div *ngIf="msg.from === 'user'" class="flex items-start gap-2 justify-end">
        <div class="bg-primary-container text-on-primary-container p-3 rounded-lg rounded-tr-none text-body-md shadow-sm max-w-[80%]">
          {{ msg.text }}
        </div>
        <div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-[14px] text-on-primary">person</span>
        </div>
      </div>
    </ng-container>
  </div>

  <!-- Barre de saisie -->
  <div class="p-3 border-t border-outline-variant bg-surface-container-lowest rounded-b-xl">
    <div class="relative">
      <input [(ngModel)]="newMessage"
             (keyup.enter)="sendMessage()"
             class="w-full pl-3 pr-10 py-2 rounded-lg border border-outline-variant bg-background text-body-md focus:ring-1 focus:ring-primary"
             placeholder="Écrivez votre message..."
             type="text"/>
      <button (click)="sendMessage()"
              [disabled]="!newMessage.trim()"
              class="absolute right-2 top-1/2 -translate-y-1/2 text-primary disabled:opacity-50">
        <span class="material-symbols-outlined">send</span>
      </button>
    </div>
  </div>
</div>
