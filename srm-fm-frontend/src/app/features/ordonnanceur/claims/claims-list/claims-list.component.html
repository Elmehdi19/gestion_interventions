<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm">
  <h3 class="font-title-lg text-title-lg font-bold mb-6">Réclamations à qualifier</h3>
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead class="bg-surface-container text-on-surface-variant">
        <tr>
          <th class="px-6 py-4 font-label-md uppercase">N°</th>
          <th class="px-6 py-4 font-label-md uppercase">Description</th>
          <th class="px-6 py-4 font-label-md uppercase">Priorité</th>
          <th class="px-6 py-4 font-label-md uppercase">Date</th>
          <th class="px-6 py-4 font-label-md uppercase text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-outline-variant">
        <tr *ngFor="let rec of reclamations" class="hover:bg-surface-container-low transition-colors">
          <td class="px-6 py-4 font-bold">{{ rec.numero }}</td>
          <td class="px-6 py-4 max-w-xs truncate">{{ rec.description }}</td>
          <td class="px-6 py-4">
            <span *ngIf="rec.urgente" class="px-2 py-1 bg-error-container text-on-error-container rounded-md text-label-md font-bold">Urgente</span>
            <span *ngIf="!rec.urgente" class="px-2 py-1 bg-surface-container text-on-surface-variant rounded-md text-label-md">Normale</span>
          </td>
          <td class="px-6 py-4 text-label-md">{{ rec.dateCreation | date:'short' }}</td>
          <td class="px-6 py-4 text-right">
            <button [routerLink]="['/ordonnanceur/claims', rec.id, 'qualify']" class="px-3 py-1 bg-primary text-on-primary rounded-lg font-bold">Qualifier</button>
          </td>
        </tr>
        <tr *ngIf="reclamations.length === 0">
          <td colspan="5" class="px-6 py-4 text-center text-on-surface-variant">Aucune réclamation à qualifier.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
