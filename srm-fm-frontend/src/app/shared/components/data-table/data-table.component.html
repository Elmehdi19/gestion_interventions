<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-sm">
  <!-- Loading state -->
  <div *ngIf="loading" class="p-4 text-center text-on-surface-variant">Chargement...</div>

  <!-- Table -->
  <div *ngIf="!loading" class="overflow-x-auto">
    <table class="w-full text-left border-collapse" *ngIf="data.length > 0; else empty">
      <thead class="bg-surface-container text-on-surface-variant">
        <tr>
          <th *ngFor="let col of columns" class="px-6 py-4 font-label-md uppercase tracking-wider">{{ col.label }}</th>
          <th class="px-6 py-4 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-outline-variant">
        <tr *ngFor="let row of data" class="hover:bg-surface-container-low transition-colors">
          <td *ngFor="let col of columns" class="px-6 py-4">
            <!-- Affichage conditionnel selon le type -->
            <ng-container [ngSwitch]="col.type">
              <span *ngSwitchCase="'status'" class="px-2 py-1 rounded-md text-label-md font-bold"
                    [class.bg-green-100.text-green-800]="row[col.key] === 'ACTIF' || row[col.key] === 'CLOTURE'"
                    [class.bg-yellow-100.text-yellow-800]="row[col.key] === 'EN_ATTENTE'"
                    [class.bg-red-100.text-red-800]="row[col.key] === 'BLOQUE'">
                {{ row[col.key] }}
              </span>
              <span *ngSwitchDefault class="text-body-md">{{ row[col.key] }}</span>
            </ng-container>
          </td>
          <td class="px-6 py-4 text-right">
            <div class="flex justify-end gap-1">
              <button (click)="edit.emit(row)" class="p-2 hover:text-primary transition-colors" title="Modifier">
                <span class="material-symbols-outlined">edit</span>
              </button>
              <button (click)="delete.emit(row)" class="p-2 hover:text-error transition-colors" title="Supprimer">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #empty>
      <div class="p-6 text-center text-on-surface-variant">{{ emptyMessage }}</div>
    </ng-template>
  </div>

  <!-- Pagination (placeholder) -->
  <div *ngIf="!loading && data.length > 0" class="p-4 border-t border-outline-variant flex justify-between items-center bg-surface-container-low">
    <span class="text-label-md text-on-surface-variant">{{ data.length }} résultat(s)</span>
    <!-- Vous pouvez ajouter une vraie pagination plus tard -->
  </div>
</div>
