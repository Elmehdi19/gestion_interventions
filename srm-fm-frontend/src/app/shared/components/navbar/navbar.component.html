<header class="flex justify-between items-center h-16 px-gutter w-full bg-surface border-b border-outline-variant sticky top-0 z-40 shadow-sm">
  <div class="flex items-center gap-4">
    <h2 class="text-title-lg font-title-lg font-bold text-primary tracking-tight">SRM-FM</h2>
    <div class="h-6 w-px bg-outline-variant"></div>
    <span class="text-body-md font-medium text-on-surface-variant">{{ breadcrumb }} &gt; {{ pageTitle }}</span>
  </div>
  <div class="flex items-center gap-4">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
      <input class="pl-10 pr-4 py-1.5 rounded-full border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary text-body-md w-64" placeholder="Recherche..." type="text"/>
    </div>
    <div class="flex gap-2">
      <button class="p-2 rounded-full hover:bg-surface-container-low transition-colors">
        <span class="material-symbols-outlined text-primary">notifications</span>
      </button>
    </div>
    <div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center border-2 border-primary-fixed">
  <span class="material-symbols-outlined text-xl">person</span>
</div>
  </div>
</header>
