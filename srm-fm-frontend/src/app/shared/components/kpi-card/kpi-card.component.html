<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm flex items-center gap-4">
  <div class="w-12 h-12 rounded-full flex items-center justify-center" [ngClass]="colorClass">
    <span class="material-symbols-outlined text-xl">{{ icon }}</span>
  </div>
  <div>
    <p class="text-label-md text-on-surface-variant">{{ title }}</p>
    <p class="text-headline-md font-bold text-on-surface">{{ value }}</p>
  </div>
</div>
